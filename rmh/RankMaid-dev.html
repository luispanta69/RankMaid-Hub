<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMH | Rank Maid Marketing Hub - Master V27</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        body { background-color: #f0f2f5; color: #1e293b; font-family: "Inter", system-ui, sans-serif; }
        
        /* Navigation */
        .nav-item { transition: all 0.2s ease-in-out; cursor: pointer; border-left: 3px solid transparent; }
        .nav-item:hover { background-color: #1f2937; color: white; }
        .nav-item.active { background-color: #ea580c; color: white; border-left: 3px solid #fb923c; }

        /* UI Components */
        .glass-panel { background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border-radius: 12px; }
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-active { background-color: #10b981; }

        /* Knowledge Base */
        .kb-card { transition: all 0.3s ease; border-top: 4px solid transparent; cursor: pointer; }
        .kb-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1); }
        .kb-card.expanded { border-color: #ea580c; }
        
        /* Typography */
        .prose h4 { font-weight: 800; color: #1e293b; margin-top: 1rem; margin-bottom: 0.5rem; font-size: 0.95rem; }
        .prose p { font-size: 0.875rem; color: #475569; line-height: 1.6; }
        .tag { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; letter-spacing: 0.05em; }

        /* Modal Overlay & Animation */
        .modal-overlay { background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); }
        .modal-content { animation: slideUp 0.3s ease-out; border-radius: 24px; overflow: hidden; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .facebook-table td, .facebook-table th { border: 1px solid #e2e8f0; padding: 8px; vertical-align: top; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>

<body class="h-screen flex overflow-hidden text-sm">
    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 text-slate-400 flex flex-col shadow-2xl z-20 flex-shrink-0">
        <div class="h-16 flex items-center px-6 bg-slate-950 border-b border-slate-800">
            <i class="fa-solid fa-layer-group text-orange-600 text-xl mr-3"></i>
            <div>
                <h1 class="font-black text-white text-xl tracking-tight">RMH</h1>
                <p class="text-[9px] uppercase font-bold text-slate-500 tracking-wider">Master V27.0</p>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 space-y-1">
            <div class="px-6 mb-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Core Operations</div>
            <div class="px-3 mb-2">
                <div onclick="App.router('global')" id="nav-global" class="nav-item active flex items-center px-3 py-2.5 text-sm font-medium rounded-r-md">
                    <i class="fa-solid fa-earth-americas w-5 text-center mr-3"></i> Global Command
                </div>
                <div onclick="App.router('goals')" id="nav-goals" class="nav-item flex items-center px-3 py-2.5 text-sm font-medium rounded-r-md">
                    <i class="fa-solid fa-bullseye w-5 text-center mr-3"></i> Goals & Alignment
                </div>
                <div onclick="App.router('knowledge')" id="nav-knowledge" class="nav-item flex items-center px-3 py-2.5 text-sm font-medium rounded-r-md">
                    <i class="fa-solid fa-book-open w-5 text-center mr-3"></i> Information Center
                </div>
            </div>

            <div class="px-6 mt-6 mb-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Paid Channels</div>
            <div class="px-3 space-y-1">
                <div onclick="App.router('facebook')" id="nav-facebook" class="nav-item flex items-center px-3 py-2 text-sm font-medium rounded-r-md">
                    <i class="fa-brands fa-facebook w-5 text-center mr-3"></i> Facebook Ads
                </div>
                <div onclick="App.router('google')" id="nav-google" class="nav-item flex items-center px-3 py-2 text-sm font-medium rounded-r-md">
                    <i class="fa-brands fa-google w-5 text-center mr-3"></i> Google Ads
                </div>
            </div>
        </nav>
        
        <div class="p-4 bg-slate-950 border-t border-slate-800 flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-orange-600 flex items-center justify-center text-white text-xs font-bold">JD</div>
            <div>
                <p class="text-xs text-white font-bold">Ops Lead</p>
                <p class="text-[10px] text-green-400">● Live Mode</p>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative h-full bg-[#F3F4F6]">
        <header class="h-16 bg-white border-b border-gray-200 flex justify-between items-center px-8 z-10 shadow-sm">
            <div>
                <h2 id="page-title" class="text-xl font-bold text-gray-800">Global Command</h2>
                <p id="page-subtitle" class="text-xs text-gray-500 font-medium">Enterprise View</p>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="App.triggerFacebookUpload()" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg shadow-lg text-xs font-bold flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i> Upload Data
                </button>
            </div>
        </header>

        <div id="content-area" class="flex-1 overflow-y-auto p-8 fade-in"></div>
    </main>

    <!-- THE GENIUS MODAL (From data.png) -->
    <div id="taskModal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white shadow-2xl w-full max-w-4xl modal-content border border-gray-200">
            <div class="bg-slate-900 px-10 py-8 flex justify-between items-center border-b border-slate-800">
                <div>
                    <h3 class="text-2xl font-black text-white flex items-center gap-3">
                        <i class="fa-solid fa-brain text-orange-500"></i> Strategic Analysis
                    </h3>
                    <p class="text-slate-400 text-xs mt-1">RMH Intelligence Engine v2.5</p>
                </div>
                <button onclick="document.getElementById('taskModal').classList.add('hidden')" class="text-gray-400 hover:text-white bg-slate-800 w-10 h-10 rounded-full flex items-center justify-center transition-all">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-0" id="modal-body">
                <!-- Content Injected via openGeniusModal -->
            </div>
        </div>
    </div>

    <script>
        // API Base configuration
        const API_BASE = `${window.location.origin}/rmh`;

        const DB = {
            facebook: {
                id: "facebook", name: "Facebook Ads", type: "paid", metrics: { spend: { current: 0 }, bookings: { current: 0 }, costPerResult: { current: 0 } },
                csvHeaders: [], csvRows: [],
                optimizations: [
                    { title: 'Scale "Prospecting_Broad" Budget', type: "Scale Opportunity", confidence: 94 }
                ]
            },
            goals: { vision: "To be the dominant SEO partner for REI.", targets: { appointments: { current: 41, target: 45 }, caq: { current: 168, target: 175 } } },
            library: { algorithms: [ { title: "Facebook Algorithm for REI", icon: "fa-brands fa-facebook", color: "border-blue-500", summary: "Meta's AI optimizes for engagement.", details: "<h4>The Learning Phase</h4><p>Requires 50 conversions/week.</p>" } ] }
        };

        const UI = {
            usd: (n) => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(n || 0),
            
            // --- MODAL ENGINE (REPLICATING data.png) ---
            openGeniusModal: async (channelId, optIndex) => {
                const modal = document.getElementById('taskModal');
                const modalBody = document.getElementById('modal-body');
                modal.classList.remove('hidden');
                modalBody.innerHTML = `<div class="p-20 text-center text-slate-400"><i class="fa-solid fa-gear fa-spin text-3xl mb-4"></i><p>Accessing Intelligence Engine...</p></div>`;

                try {
                    const res = await fetch(`${API_BASE}/api/get-scale-analysis.php`);
                    const data = await res.json();

                    modalBody.innerHTML = `
                        <div class="grid grid-cols-3 divide-x divide-gray-100">
                            <!-- Left: Strategy & Instructions -->
                            <div class="col-span-2 p-12">
                                <div class="flex items-center gap-4 mb-8">
                                    <span class="bg-orange-100 text-orange-700 text-[10px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest">${data.insight_type || 'Scale Opportunity'}</span>
                                    <span class="text-xs font-bold text-gray-400">Confidence: ${data.confidence || 94}%</span>
                                </div>
                                <h2 class="text-4xl font-black text-slate-900 mb-8 leading-tight">Scale "${data.campaign_name || 'Prospecting_Broad'}" Budget</h2>
                                <div class="mb-10">
                                    <h5 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">Root Cause</h5>
                                    <div class="bg-slate-50 p-6 rounded-2xl border-l-4 border-slate-300">
                                        <p class="text-slate-600 italic text-base">"${data.root_cause || 'Campaign has sustained ROAS > 6.0x for 14 days.'}"</p>
                                    </div>
                                </div>
                                <div>
                                    <h5 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Tactical Instruction</h5>
                                    <div class="text-slate-700 text-base font-semibold leading-loose">
                                        1. Navigate to <strong>Ads Manager > Campaigns</strong>.<br>
                                        2. Select <strong>${data.campaign_name || 'Prospecting_Broad_V3'}</strong>.<br>
                                        3. Increase Daily Budget from <strong>$${data.current_budget || 100} to $${data.target_budget || 120}</strong> (+20%).
                                    </div>
                                </div>
                            </div>
                            <!-- Right: Projected Impact -->
                            <div class="col-span-1 bg-slate-50/50 p-12 flex flex-col justify-between">
                                <div>
                                    <h5 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-8">Projected Impact</h5>
                                    <div class="space-y-6">
                                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                            <p class="text-[10px] font-bold uppercase text-gray-400 mb-2">Leads</p>
                                            <p class="text-2xl font-black text-emerald-600">${data.leads_projection || '+12 Leads/mo'}</p>
                                        </div>
                                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                            <p class="text-[10px] font-bold uppercase text-gray-400 mb-2">Revenue</p>
                                            <p class="text-2xl font-black text-emerald-600">${data.revenue_projection || '+$4,500 Revenue'}</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="mt-12 space-y-4">
                                    <button onclick="alert('Applying Budget Change...')" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-black py-5 rounded-2xl shadow-xl transition-all active:scale-95">Apply Changes</button>
                                    <button onclick="document.getElementById('taskModal').classList.add('hidden')" class="w-full bg-white hover:bg-gray-50 text-slate-500 font-bold py-4 rounded-2xl border border-gray-200">Snooze</button>
                                </div>
                            </div>
                        </div>
                    `;
                } catch (e) { modalBody.innerHTML = `<div class="p-10 text-red-500">Error connecting to engine.</div>`; }
            },

            renderGlobal: () => {
                return `
                    <div class="grid grid-cols-5 gap-6 mb-8">
                        <div class="glass-panel p-6"><p class="text-[10px] uppercase font-bold text-gray-400">Total Revenue</p><h3 class="text-2xl font-black text-emerald-600">$12,000</h3></div>
                        <div class="glass-panel p-6"><p class="text-[10px] uppercase font-bold text-gray-400">Total Spend</p><h3 class="text-2xl font-black text-slate-600">$3,100</h3></div>
                        <div class="glass-panel p-6"><p class="text-[10px] uppercase font-bold text-gray-400">Blended CAQ</p><h3 class="text-2xl font-black text-orange-600">$388</h3></div>
                        <div class="glass-panel p-6"><p class="text-[10px] uppercase font-bold text-gray-400">Pipeline Volume</p><h3 class="text-2xl font-black">45</h3></div>
                        <div class="glass-panel p-6"><p class="text-[10px] uppercase font-bold text-gray-400">Avg Deal Size</p><h3 class="text-2xl font-black text-blue-600">$7,500</h3></div>
                    </div>
                    <div class="grid grid-cols-3 gap-8">
                        <div class="col-span-2 glass-panel p-8"><h3 class="font-bold text-gray-700 mb-4">Global Revenue Velocity</h3><div class="h-80"><canvas id="mainChart"></canvas></div></div>
                        <div class="bg-slate-900 text-white p-8 rounded-3xl shadow-xl border-l-8 border-orange-600">
                            <h3 class="font-bold text-slate-400 text-[10px] uppercase tracking-widest mb-8">AI FEED</h3>
                            <div class="space-y-8">
                                <div class="flex justify-between items-center"><p class="text-xs font-bold text-emerald-400">• Facebook</p><button onclick="App.router('facebook')" class="bg-orange-600 text-[9px] px-3 py-1 rounded">Approve</button></div>
                                <div class="flex justify-between items-center"><p class="text-xs font-bold text-red-400">• Google</p><button class="bg-orange-600 text-[9px] px-3 py-1 rounded">Fix</button></div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderFacebook: () => {
                const ch = DB.facebook;
                return `
                    <div class="mb-8">
                        <h2 class="text-2xl font-black text-gray-800">Facebook Ads</h2>
                        <p class="text-xs text-gray-500">Live Channel Performance</p>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                        <div class="lg:col-span-2 glass-panel p-6"><h3 class="font-bold text-gray-700">Daily Trend</h3><div class="h-64"><canvas id="fbChart"></canvas></div></div>
                        <div class="glass-panel p-0 overflow-hidden flex flex-col border-t-4 border-orange-600">
                            <div class="p-6 bg-slate-50 border-b flex justify-between items-center"><h3 class="font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid fa-robot text-orange-600"></i> Genius AI</h3></div>
                            <div class="p-6 space-y-4">
                                ${ch.optimizations.map((opt, idx) => `
                                    <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                                        <p class="text-[10px] font-bold uppercase text-orange-600 mb-2">${opt.type}</p>
                                        <h4 class="text-sm font-bold text-gray-800 mb-4">${opt.title}</h4>
                                        <button onclick="UI.openGeniusModal('facebook', ${idx})" class="w-full bg-slate-900 text-white text-xs font-bold py-3 rounded-xl hover:bg-orange-600">Analyze</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
        };

        const App = {
            router: (route) => {
                const container = document.getElementById('content-area');
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const nav = document.getElementById(`nav-${route}`);
                if (nav) nav.classList.add('active');

                if (route === 'global') {
                    container.innerHTML = UI.renderGlobal();
                    setTimeout(() => new Chart(document.getElementById('mainChart'), { type: 'line', data: { labels: ['M', 'T', 'W', 'T', 'F', 'S', 'S'], datasets: [{ data: [65, 59, 80, 81, 56, 95, 110], borderColor: '#ea580c', backgroundColor: '#ea580c10', fill: true }] }, options: { maintainAspectRatio: false, plugins: { legend: false } } }), 50);
                } else if (route === 'facebook') {
                    container.innerHTML = UI.renderFacebook();
                    setTimeout(() => new Chart(document.getElementById('fbChart'), { type: 'line', data: { labels: ['M', 'T', 'W', 'T', 'F', 'S', 'S'], datasets: [{ data: [3.2, 3.5, 4.1, 4.5, 5.2, 5.8, 6.2], borderColor: '#ea580c', backgroundColor: '#ea580c10', fill: true }] }, options: { maintainAspectRatio: false, plugins: { legend: false } } }), 50);
                } else if (route === 'knowledge') {
                    container.innerHTML = UI.renderKnowledge();
                }
            },
            triggerFacebookUpload: () => { document.getElementById('fbUpload').click(); },
            init: () => { App.router('global'); }
        };

        window.addEventListener('DOMContentLoaded', App.init);
    </script>
    <input type="file" id="fbUpload" class="hidden" accept=".csv" />
</body>
</html>
